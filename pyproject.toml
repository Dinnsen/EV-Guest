[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PIE", "RUF", "SIM", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.ev_guest"]
known-third-party = ["homeassistant"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["custom_components.ev_guest"]

[tool.coverage.report]
show_missing = true
skip_covered = true
