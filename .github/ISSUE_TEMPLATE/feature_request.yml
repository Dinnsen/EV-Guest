name: Feature request
description: Suggest an idea for EV Guest.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation and what is missing today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could EV Guest help?
